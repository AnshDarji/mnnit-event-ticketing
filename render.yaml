# Deploy the repository root containing this file. Set every sync:false value
# in Render; reuse the SAME JWT/QR/internal secrets on all four services.
# Free services communicate over their public HTTPS URLs, not private hosts.
services:
  - type: web
    name: mnnit-auth
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infra/Dockerfile.backend
    dockerContext: .
    dockerCommand: python -m scripts.start_service --service auth
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: mnnit-db, property: connectionString}
      - key: ENVIRONMENT
        value: production
      - key: DEMO_AUTH_ENABLED
        value: "false"
      - key: PILOT_ROLE_SELECTION
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: QR_SECRET
        sync: false
      - key: INTERNAL_SECRET
        sync: false
  - type: web
    name: mnnit-events
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infra/Dockerfile.backend
    dockerContext: .
    dockerCommand: python -m scripts.start_service --service events
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: mnnit-db, property: connectionString}
      - key: ENVIRONMENT
        value: production
      - key: DEMO_AUTH_ENABLED
        value: "false"
      - key: PILOT_ROLE_SELECTION
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: AUTH_SERVICE_URL
        value: https://mnnit-auth.onrender.com
      - key: JWT_SECRET
        sync: false
      - key: QR_SECRET
        sync: false
      - key: INTERNAL_SECRET
        sync: false
  - type: web
    name: mnnit-ticketing
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infra/Dockerfile.backend
    dockerContext: .
    dockerCommand: python -m scripts.start_service --service ticketing
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: mnnit-db, property: connectionString}
      - key: ENVIRONMENT
        value: production
      - key: DEMO_AUTH_ENABLED
        value: "false"
      - key: PILOT_ROLE_SELECTION
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: AUTH_SERVICE_URL
        value: https://mnnit-auth.onrender.com
      - key: EVENT_SERVICE_URL
        value: https://mnnit-events.onrender.com
      - key: JWT_SECRET
        sync: false
      - key: QR_SECRET
        sync: false
      - key: INTERNAL_SECRET
        sync: false
  - type: web
    name: mnnit-gateway
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infra/Dockerfile.backend
    dockerContext: .
    dockerCommand: python -m scripts.start_service --service gateway
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: mnnit-db, property: connectionString}
      - key: ENVIRONMENT
        value: production
      - key: DEMO_AUTH_ENABLED
        value: "false"
      - key: PILOT_ROLE_SELECTION
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: AUTH_SERVICE_URL
        value: https://mnnit-auth.onrender.com
      - key: EVENT_SERVICE_URL
        value: https://mnnit-events.onrender.com
      - key: TICKETING_SERVICE_URL
        value: https://mnnit-ticketing.onrender.com
      - key: JWT_SECRET
        sync: false
      - key: QR_SECRET
        sync: false
      - key: INTERNAL_SECRET
        sync: false

databases:
  - name: mnnit-db
    databaseName: mnnit
    user: mnnit
    plan: free
    region: singapore
    postgresMajorVersion: "16"
